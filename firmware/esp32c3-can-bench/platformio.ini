[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = platformio/espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
monitor_speed = 115200
monitor_filters = direct

[env:esp32c3-autonomous]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DBENCH_AUTONOMOUS=1

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = yes
lib_deps = throwtheswitch/Unity@2.6.1
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -O0
    -g
    --coverage
    -lgcov
    -Itest/support
    -Isrc

[env:esp32c3-buttons]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DBENCH_BUTTONS=1

[env:native-buttons]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBENCH_BUTTONS=1

; Diagnostic only. Emission is reported successful without any bus acknowledgement:
; never use these images to conclude that a receiver or the wiring works.
[env:esp32c3-buttons-noack]
extends = env:esp32c3-buttons
build_flags =
    ${env:esp32c3-buttons.build_flags}
    -DBENCH_NO_ACK=1

[env:native-noack]
extends = env:native-buttons
build_flags =
    ${env:native-buttons.build_flags}
    -DBENCH_NO_ACK=1

[env:native-autonomous]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBENCH_AUTONOMOUS=1

[env:esp32c3-receiver]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DBENCH_RECEIVER=1

[env:native-receiver]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBENCH_RECEIVER=1

[env:esp32c3-slcan]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DBENCH_SLCAN=1

[env:native-slcan]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBENCH_SLCAN=1
