name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Initialize CodeQL
        uses: github/codeql-action/init@276e2ce25d959f0e04da2c6b73e26b3231395db1
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@276e2ce25d959f0e04da2c6b73e26b3231395db1
