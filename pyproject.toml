[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "can-sniffer"
version = "0.1.0"
description = "Read-only graphical CAN bus monitor for Infypower charger modules on Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-can>=4.5,<5",
    "pydantic-settings>=2.6,<3",
    "PySide6>=6.8,<7",
]

[project.scripts]
can-sniffer = "can_sniffer.app:main"

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/can_sniffer"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=can_sniffer --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
