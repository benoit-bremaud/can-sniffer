29">At most 10 single-shot attempts, 1 Hz.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="271" x="399" y="279.1189">Wait for the final completion before stopping.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="292" x="399" y="296.8249">USB connection changes do not affect this series.</text><path d="M448.5,513.5158 L448.5,541.0158 L413.17,545.0158 L448.5,549.0158 L448.5,576.6339 A0,0 0 0 0 448.5,576.6339 L692.5,576.6339 A0,0 0 0 0 692.5,576.6339 L692.5,523.5158 L682.5,513.5158 L448.5,513.5158 A0,0 0 0 0 448.5,513.5158 " fill="#FBFB77" filter="url(#fzh3gv518th7o)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M682.5,513.5158 L682.5,523.5158 L692.5,523.5158 L682.5,513.5158 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="223" x="454.5" y="532.4129">No restart via USB or start command.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="221" x="454.5" y="550.1189">Only MCU reset/power cycle re-arms.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="165" x="454.5" y="567.8249">Never connect to a charger.</text><!--MD5=[026748cd246879ed5481b6fc18ce1317]
