-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="257" x="1196.03" y="417.1189">Reset returns to ReleaseWait, not emission.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="218" x="1196.03" y="434.8249">Cleanup may be retried by USB stop,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="240" x="1196.03" y="452.5309">but does not clear the runner fault latch.</text><rect fill="#FEFECE" filter="url(#f6etxij8jg315)" height="269.0679" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="438" x="303.03" y="32.5158"/><rect fill="#FFFFFF" height="234" rx="12.5" ry="12.5" style="stroke: #FFFFFF; stroke-width: 1.0;" width="432" x="306.03" y="64.5838"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="303.03" x2="741.03" y1="61.5838" y2="61.5838"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="58" x="493.03" y="52.4818">Running</text><ellipse cx="401.74" cy="84.5838" fill="#000000" filter="url(#f6etxij8jg315)" rx="10" ry="10" style="stroke: none; stroke-width: 1.0;"/><rect fill="#FEFECE" filter="url(#f6etxij8jg315)" height="50" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="72" x="365.74" y="131.5838"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="365.74" x2="437.74" y1="160.6517" y2="160.6517"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="52" x="375.74" y="151.5497">Waiting</text><rect fill="#FEFECE" filter="url(#f6etxij8jg315)" height="50" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="76" x="363.74" y="236.5838"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="363.74" x2="439.74" y1="265.6517" y2="265.6517"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="56" x="373.74" y="256.549